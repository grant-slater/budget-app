<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horizon</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Horizon">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f766e">
<style>
:root{
  --paper:#f3f6f5; --surface:#ffffff; --ink:#10231f; --mute:#5d716c; --line:#dbe4e1; --chip:#e5eeeb;
  --brand:#0f766e; --brand-ink:#ffffff; --warn:#c2410c; --warn-bg:#fdeee6; --good:#15803d;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0b1311; --surface:#14201d; --ink:#e8f1ee; --mute:#93a8a2; --line:#233531; --chip:#1c2c28;
  --brand:#2dd4bf; --brand-ink:#04211d; --warn:#fb923c; --warn-bg:#2a1a10; --good:#4ade80;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:10px;padding:12px 18px 4px;max-width:720px;width:100%;margin:0 auto}
header h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em;flex:1}
#status{font-size:12px;color:var(--mute)}
#gear{background:none;border:0;color:var(--mute);padding:6px;display:flex}
main{flex:1;overflow-y:auto;padding:6px 18px 28px;max-width:720px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
section{padding:18px 0;border-bottom:1px solid var(--line)}
section:last-child{border-bottom:0}
h2{font-size:13px;font-weight:600;color:var(--mute);margin:0 0 10px}
.big{font-size:46px;font-weight:650;letter-spacing:-.03em;line-height:1.05}
.sub{color:var(--mute);font-size:14px}
.neg{color:var(--warn)} .pos{color:var(--good)} .mute{color:var(--mute);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.link{background:none;border:0;color:var(--brand);font:inherit;font-size:14px;padding:0;font-weight:600}
input,select{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
label{display:block;font-size:12px;color:var(--mute);margin:14px 0 4px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:650;background:var(--brand);color:var(--brand-ink);margin-top:16px}
.btn.sec{background:var(--chip);color:var(--ink)} .btn.ghost{background:none;color:var(--warn);border:1px solid var(--line);margin-top:8px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font:inherit;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.alert{border-left:3px solid var(--good);padding:2px 0 2px 12px;margin:14px 0 4px}
.alert.bad{border-color:var(--warn)}
.alert b{font-size:16px}
.bar{height:7px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px} .bar i.over{background:var(--warn)}
.cat{padding:9px 0}
.ev{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ev:last-child{border-bottom:0}
.ev .d{font-size:12px;color:var(--mute);line-height:1.2}
.ev .d b{display:block;font-size:15px;color:var(--ink)}
.ev .r{text-align:right}
.ev .r small{display:block;font-size:12px;color:var(--mute)}
.ev.below{background:linear-gradient(90deg,var(--warn-bg),transparent 70%)}
.ev.below .r small{color:var(--warn);font-weight:600}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 2px;font-size:13px;font-weight:600;color:var(--mute)}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:8px 0 4px}
.mnav button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:16px;color:var(--ink)}
.trend{display:flex;align-items:flex-end;gap:8px;height:120px;position:relative;margin-top:6px}
.trend div.b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mute)}
.trend div.b i{display:block;width:100%;background:var(--brand);border-radius:5px 5px 0 0;opacity:.85;min-height:2px}
.trend div.b i.over{background:var(--warn)}
.trend div.b span{margin-top:4px}
.tx{padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.tx:last-child{border:0}
nav{display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:9px 2px 8px;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand);font-weight:650}
nav .plus{padding:0 0 10px;align-self:end}
nav .plus span{display:flex;width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--brand-ink);align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 4px 14px rgba(15,118,110,.45)}
nav .plus svg{width:28px;height:28px;stroke-width:2.4}
#wrap{position:fixed;inset:0;z-index:20;display:none}
#wrap.open{display:block}
#backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;max-height:92%;overflow-y:auto}
.shd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.shd b{font-size:17px}.shd button{background:none;border:0;font-size:20px;color:var(--mute);padding:4px 8px}
input.amt{font-size:36px;font-weight:650;text-align:center;padding:12px;margin-top:12px}
.nudge{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.nudge button{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:10px 4px;border-radius:10px;font:inherit;font-size:14px}
.prev{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:14px}
.prev.bad{background:var(--warn-bg);color:var(--warn)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center;z-index:30}
#toast.show{opacity:1}
.err{color:var(--warn);font-size:13px;margin:8px 0}
.brow{display:grid;grid-template-columns:1fr 100px 36px;gap:8px;margin-bottom:8px}
.brow button{border:0;background:none;color:var(--warn);font-size:18px}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>Horizon</h1><span id="status"></span>
<button id="gear" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></header>
<main id="main"></main>
<nav id="nav">
  <button data-t="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Home</button>
  <button data-t="future"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 8-9M15 5h5v5"/></svg>Future</button>
  <button id="plus" class="plus" aria-label="Add entry"><span><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-t="budget"><svg viewBox="0 0 24 24"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Budget</button>
  <button data-t="activity"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Activity</button>
</nav>
<div id="wrap"><div id="backdrop"></div><div id="sheet"></div></div>
<div id="toast"></div>

<script>
// ============ helpers ============
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const cfg={repo:LS.get('repo')||'',token:LS.get('token')||''};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const ymOf=s=>s.slice(0,7);
const dayNum=s=>Math.floor(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/86400000);
const fromDayNum=n=>{const d=new Date(n*86400000);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
const addDays=(s,k)=>fromDayNum(dayNum(s)+k);
const dt=s=>new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
const fmtDate=(s,o)=>dt(s).toLocaleDateString('en-US',o||{month:'short',day:'numeric'});
const fmtLong=s=>dt(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const monthName=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7)-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
const monthShort=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7)-1,1).toLocaleDateString('en-US',{month:'short'});
const shiftMonth=(ym,k)=>{const d=new Date(+ym.slice(0,4),+ym.slice(5,7)-1+k,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const daysInMonth=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();

// ============ state ============
const state={tab:'home',entries:[],planned:[],budget:{categories:[],transfers:[],settings:{}},sha:{csv:null,budget:null,planned:null},
  month:todayStr().slice(0,7),range:90,search:'',error:'',focus:null,plannedDirty:false};
function saveCache(){LS.set('cache2',JSON.stringify({entries:state.entries,planned:state.planned,budget:state.budget,sha:state.sha}))}
try{const c=JSON.parse(LS.get('cache2')||'null');if(c){state.entries=c.entries||[];state.planned=c.planned||[];state.budget=c.budget||state.budget;state.sha=c.sha||state.sha}}catch(e){}

// ============ csv / base64 ============
const COLS=['id','date','type','amount','category','note'];
function csvParse(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===','){row.push(f);f=''}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''} else if(c!=='\r')f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  const head=rows.shift()||COLS;
  return rows.filter(r=>r.length>1).map(r=>{const o={};head.forEach((h,i)=>o[h]=r[i]??'');o.amount=parseFloat(o.amount)||0;return o});
}
const csvCell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const csvStringify=list=>[COLS.join(',')].concat(list.map(e=>COLS.map(c=>csvCell(e[c])).join(','))).join('\n')+'\n';
const b64enc=s=>{const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=8192)x+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(x)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));

// ============ core money logic ============
// BEGIN CORE
const settings=()=>Object.assign({threshold:1000,openingBalance:0,actualBalance:null,actualDate:null},state.budget.settings||{});
function normalize(list){return list.map(e=>e.type==='transfer'?{...e,type:e.category==='Mileage (to Save)'?'income':'expense'}:e)}
const signed=e=>(e.type==='income'?1:-1)*e.amount;
const isExcluded=c=>(state.budget.transfers||[]).includes(c)||c==='Reconcile';
const balanceNow=()=>settings().openingBalance+state.entries.reduce((s,e)=>s+signed(e),0);
const cmpPl=(a,b)=>a.date<b.date?-1:a.date>b.date?1:String(a.id).localeCompare(String(b.id));

// Walk planned items in date order from today's balance. Overdue items count as today.
function forecast(planned){
  planned=planned||state.planned;
  const today=todayStr(),th=settings().threshold;
  let bal=balanceNow();const start=bal;
  const items=planned.slice().sort(cmpPl).map(p=>{
    const eff=p.date<today?today:p.date;bal+=signed(p);
    return {...p,eff,overdue:p.date<today,bal,below:bal<th};
  });
  let low={bal:start,date:today,item:null};
  items.forEach(it=>{if(it.bal<low.bal)low={bal:it.bal,date:it.eff,item:it}});
  const dips=[];let cur=null;
  if(start<th){cur={start:today,startItem:null,low:{bal:start,date:today},end:null}}
  items.forEach(it=>{
    if(it.below){ if(!cur)cur={start:it.eff,startItem:it,low:{bal:it.bal,date:it.eff},end:null};
      else if(it.bal<cur.low.bal)cur.low={bal:it.bal,date:it.eff}; }
    else if(cur){cur.end=it.eff;dips.push(cur);cur=null}
  });
  if(cur)dips.push(cur);
  const lastDate=items.length?items[items.length-1].eff:today;
  return {start,items,low,dips,th,lastDate,end:items.length?items[items.length-1].bal:start};
}
// Find a single expense that, moved to just after the next income, clears the dip.
function suggestFix(fc){
  const dp=fc.dips[0];if(!dp)return null;const today=todayStr();
  const nextInc=fc.items.find(it=>it.type==='income'&&it.eff>dp.low.date);if(!nextInc)return null;
  let best=null;
  fc.items.filter(it=>it.type==='expense'&&it.date>=today&&it.eff<=dp.low.date).forEach(it=>{
    [0,1].forEach(off=>{
      const nd=addDays(nextInc.eff,off);if(nd<=it.date)return;
      const f=forecast(state.planned.map(p=>p.id===it.id?{...p,date:nd}:p));
      if(f.dips.length<fc.dips.length){
        const shift=dayNum(nd)-dayNum(it.date);
        if(!best||f.dips.length<best.dips||(f.dips.length===best.dips&&shift<best.shift))best={item:it,to:nd,shift,dips:f.dips.length};
      }
    });
  });
  return best;
}
function dayBalances(fc,span){
  const t0=dayNum(todayStr()),out=[];let i=0,bal=fc.start;
  for(let d=0;d<=span;d++){while(i<fc.items.length&&dayNum(fc.items[i].eff)-t0<=d){bal=fc.items[i].bal;i++}out.push(bal)}
  return out;
}
function monthData(ym){
  const list=state.entries.filter(e=>ymOf(e.date)===ym);
  const inc=list.filter(e=>e.type==='income'&&!isExcluded(e.category)).reduce((s,e)=>s+e.amount,0);
  const exp=list.filter(e=>e.type==='expense'&&!isExcluded(e.category));
  const spent=exp.reduce((s,e)=>s+e.amount,0);const by={};
  exp.forEach(e=>by[e.category]=(by[e.category]||0)+e.amount);
  return {inc,spent,by};
}
const budgetTotal=()=>state.budget.categories.reduce((s,c)=>s+c.budget,0);
// END CORE

// ============ spoken-sentence parser (Siri inbox) ============
function allCats(type){
  const seen={};state.entries.filter(e=>e.type===type&&!isExcluded(e.category)).forEach(e=>seen[e.category]=(seen[e.category]||0)+1);
  return Object.keys(seen).sort((a,b)=>seen[b]-seen[a]);
}
function parseSpoken(text){
  let t=String(text||'').trim();
  const m=t.match(/(\d[\d,]*(?:\.\d+)?)/);const amount=m?parseFloat(m[1].replace(/,/g,'')):0;
  if(m)t=t.replace(m[0],' ');t=t.replace(/\$/g,' ');
  const type=/\b(income|paycheck|deposit|refund)\b/i.test(t)?'income':'expense';
  t=t.replace(/\b(income|paycheck|deposit|refund)\b/ig,' ');
  let category='';
  const names=state.budget.categories.map(c=>c.name).concat(allCats('expense')).filter((v,i,a)=>v&&a.indexOf(v)===i).sort((a,b)=>b.length-a.length);
  for(const n of names){const re=new RegExp('\\b'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');if(re.test(t)){category=n;t=t.replace(re,' ');break}}
  if(!category)category=type==='income'?'Income':'Misc';
  t=t.replace(/\b(add|an?|the|expense|expenses|from|at|to|my|log|in|on|for|of|dollars?|bucks|spent|spend|cost|costs|paid|pay|category|and)\b/ig,' ').replace(/\s+/g,' ').trim();
  return {amount,type,category,note:t.replace(/\b\w/g,c=>c.toUpperCase())};
}

// ============ GitHub ============
async function demoGh(path,opts){
  const D=window.__DEMO,files=D.files,p=path.split('?')[0],m=(opts.method||'GET').toUpperCase();
  const nf=()=>{const e=new Error('GitHub 404');e.status=404;return e};
  if(m==='GET'){
    if(p==='inbox'){const l=Object.keys(files).filter(k=>k.startsWith('inbox/'));if(!l.length)throw nf();return l.map(k=>({name:k.slice(6),sha:'s'+k}))}
    if(!(p in files))throw nf();return {content:b64enc(files[p]),sha:'sha'+(D.v[p]||1)};
  }
  const body=opts.body?JSON.parse(opts.body):{};
  if(m==='PUT'){files[p]=b64dec(body.content);D.v[p]=(D.v[p]||1)+1;D.puts=(D.puts||0)+1;return {content:{sha:'sha'+D.v[p]}}}
  if(m==='DELETE'){delete files[p];return null}
}
async function gh(path,opts={}){
  if(window.__DEMO)return demoGh(path,opts);
  const r=await fetch(`https://api.github.com/repos/${cfg.repo}/contents/${path}`,{cache:'no-store',...opts,
    headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+cfg.token,'Content-Type':'application/json'}});
  if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e}
  return r.status===204?null:r.json();
}
async function loadFile(path){const j=await gh(path+'?t='+Date.now());return {text:b64dec(j.content),sha:j.sha}}
async function putFile(path,text,sha,msg){
  const body={message:msg,content:b64enc(text)};if(sha)body.sha=sha;
  const j=await gh(path,{method:'PUT',body:JSON.stringify(body)});return j.content.sha;
}
// write with one retry that refreshes the file's sha (we're the only editor of these files)
async function putRetry(path,text,key,msg){
  for(let i=0;i<2;i++){
    try{state.sha[key]=await putFile(path,text,state.sha[key],msg);return}
    catch(e){
      if((e.status===409||e.status===422)&&i===0){
        try{const j=await gh(path+'?t='+Date.now());state.sha[key]=j.sha}catch(x){if(x.status===404)state.sha[key]=null;else throw x}
        continue;
      }
      throw e;
    }
  }
}
const configured=()=>!!window.__DEMO||(cfg.repo&&cfg.token);
const sortEntries=l=>l.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:String(a.id).localeCompare(String(b.id)));

async function loadAll(){
  if(!configured()){render();return}
  setStatus('Syncing…');
  try{
    const c=await loadFile('expenses.csv');state.entries=normalize(csvParse(c.text));state.sha.csv=c.sha;
    try{const b=await loadFile('budget.json');state.budget=JSON.parse(b.text);state.sha.budget=b.sha}catch(e){if(e.status!==404)throw e}
    if(!state.plannedDirty){
      try{const p=await loadFile('planned.csv');state.planned=csvParse(p.text);state.sha.planned=p.sha}
      catch(e){if(e.status!==404)throw e;state.planned=[];state.sha.planned=null}
    }
    await mergeInbox();saveCache();setStatus('Synced');state.error='';
  }catch(e){
    state.error=e.status===401?'Token rejected. Check Settings.':e.status===404?'Repo or expenses.csv not found. Check Settings.':'Could not sync ('+e.message+'). Showing saved copy.';
    setStatus('Offline');
  }
  render();
}
async function mergeInbox(){
  let list;try{list=await gh('inbox?t='+Date.now())}catch(e){if(e.status===404)return;throw e}
  list=list.filter(f=>/\.(json|txt)$/.test(f.name));if(!list.length)return;
  const have=new Set(state.entries.map(e=>e.id));const add=[];
  for(const f of list){
    try{
      const raw=(await loadFile('inbox/'+f.name)).text;const id=f.name.replace(/\.(json|txt)$/,'');
      const st=id.match(/^(\d{4})(\d{2})(\d{2})/);const fdate=st?`${st[1]}-${st[2]}-${st[3]}`:todayStr();let e;
      if(f.name.endsWith('.json')){const j=JSON.parse(raw);e={date:j.date||fdate,type:j.type||'expense',amount:Math.abs(parseFloat(j.amount)||0),category:j.category||'Misc',note:j.note||''}}
      else{const p=parseSpoken(raw);e={date:fdate,type:p.type,amount:p.amount,category:p.category,note:p.note||raw.trim().slice(0,60)}}
      if(!have.has(id)&&e.amount)add.push({id,...e});
    }catch(err){}
  }
  if(add.length){
    const next=sortEntries(state.entries.concat(add));
    state.sha.csv=await putFile('expenses.csv',csvStringify(next),state.sha.csv,`Add ${add.length} from inbox`);state.entries=next;
  }
  for(const f of list){try{await gh('inbox/'+f.name,{method:'DELETE',body:JSON.stringify({message:'Clear inbox item',sha:f.sha})})}catch(e){}}
  if(add.length)toast(`${add.length} new from Siri`);
}
async function mutate(fn){
  for(let i=0;i<2;i++){
    try{
      const next=sortEntries(fn(state.entries.map(e=>({...e}))));
      state.sha.csv=await putFile('expenses.csv',csvStringify(next),state.sha.csv,'Update expenses');
      state.entries=next;saveCache();return;
    }catch(e){
      if((e.status===409||e.status===422)&&i===0){const c=await loadFile('expenses.csv');state.entries=normalize(csvParse(c.text));state.sha.csv=c.sha;continue}
      throw e;
    }
  }
}

// ============ forecast chart ============
let chartSeq=0,chartData=null;
function chartSVG(fc,days,h){
  const W=360,H=h||180,pL=6,pR=46,pT=16,pB=22,id='c'+(++chartSeq);
  const t0=dayNum(todayStr()),span=Math.max(14,days),th=fc.th;
  const pts=[[0,fc.start]];
  fc.items.forEach(it=>{const x=dayNum(it.eff)-t0;if(x>span)return;const last=pts[pts.length-1];pts.push([x,last[1]]);pts.push([x,it.bal])});
  pts.push([span,pts[pts.length-1][1]]);
  const vals=pts.map(p=>p[1]).concat([th]);let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*.12||100;lo-=pad;hi+=pad;
  const X=x=>pL+x/span*(W-pL-pR),Y=v=>pT+(1-(v-lo)/(hi-lo))*(H-pT-pB);
  const d='M'+pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('L');
  const ty=Y(th);
  let lowPt=null;pts.forEach(p=>{if(!lowPt||p[1]<lowPt[1])lowPt=p});
  const lowBelow=lowPt[1]<th;
  let ticks='';
  for(let k=0;k<=span+31;k++){const ds=addDays(todayStr(),k);if(k>span)break;
    if(ds.slice(8)==='01'&&k>2){ticks+=`<line x1="${X(k)}" x2="${X(k)}" y1="${H-pB}" y2="${H-pB+4}" stroke="var(--line)"/><text x="${X(k)}" y="${H-6}" font-size="10" fill="var(--mute)" text-anchor="middle">${monthShort(ds.slice(0,7))}</text>`}}
  const lowLabelY=lowBelow?Y(lowPt[1])+14:Y(lowPt[1])-8;
  chartData={span,bal:dayBalances(fc,span),W,pL,pR,t0};
  return `<svg class="chart" id="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected balance">
  <defs><clipPath id="${id}a"><rect x="0" y="0" width="${W}" height="${ty}"/></clipPath><clipPath id="${id}b"><rect x="0" y="${ty}" width="${W}" height="${H}"/></clipPath></defs>
  <line x1="${pL}" x2="${W-pR}" y1="${ty}" y2="${ty}" stroke="var(--warn)" stroke-width="1" stroke-dasharray="4 4" opacity=".8"/>
  <text x="${W-pR+4}" y="${ty+3.5}" font-size="10" fill="var(--warn)">${money(th)}</text>
  <path d="${d}" class="ln" stroke="var(--ink)" clip-path="url(#${id}a)"/>
  <path d="${d}" class="ln" stroke="var(--warn)" clip-path="url(#${id}b)"/>
  ${ticks}
  <circle cx="${X(lowPt[0])}" cy="${Y(lowPt[1])}" r="3.5" fill="${lowBelow?'var(--warn)':'var(--ink)'}"/>
  <text x="${Math.min(Math.max(X(lowPt[0]),30),W-pR-10)}" y="${lowLabelY}" font-size="11" font-weight="600" text-anchor="middle" fill="${lowBelow?'var(--warn)':'var(--ink)'}">${money(Math.round(lowPt[1]))}</text>
  <line id="cur" x1="0" x2="0" y1="${pT}" y2="${H-pB}" stroke="var(--mute)" stroke-width="1" opacity="0"/>
  <rect id="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg>`;
}
function bindChart(){
  const svg=$('#chart');if(!svg||!chartData)return;const cd=chartData;const tip=$('#tip');
  const move=ev=>{
    const r=svg.getBoundingClientRect();const cx=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width*cd.W;
    let day=Math.round((cx-cd.pL)/(cd.W-cd.pL-cd.pR)*cd.span);day=Math.max(0,Math.min(cd.span,day));
    const x=cd.pL+day/cd.span*(cd.W-cd.pL-cd.pR);const c=$('#cur');c.setAttribute('x1',x);c.setAttribute('x2',x);c.setAttribute('opacity','1');
    const b=cd.bal[day];tip.innerHTML=`${fmtLong(addDays(todayStr(),day))} <b class="${b<settings().threshold?'neg':''}">${money(Math.round(b))}</b>`;
  };
  const end=()=>{$('#cur').setAttribute('opacity','0');tip.textContent='Touch the chart to read any day'};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);svg.addEventListener('pointerleave',end);svg.addEventListener('pointerup',end);
}

  const e=id?state.entries.find(x=>x.id===id):null;let type=e?e.type:'expense';
  const draw=()=>{
    openSheet(`<div class="shd"><b>${e?'Edit entry':'Add entry'}</b><button id="x">✕</button></div>
    <div class="seg" id="tseg"><button data-v="expense" class="${type==='expense'?'on':''}">Expense</button><button data-v="income" class="${type==='income'?'on':''}">Income</button></div>
    <input class="amt" id="amt" inputmode="decimal" placeholder="$0.00" value="${e?e.amount:(window.__keep?.amt||'')}">
    <label>Category</label><select id="cat">${catOptions(type,e&&e.type===type?e.category:(window.__keep?.cat||''))}</select>
    <input id="catOther" class="hide" placeholder="Category name" style="margin-top:8px">
    <label>Store or note</label><input id="note" placeholder="Walmart" value="${e?esc(e.note):''}">
    <label>Date</label><input id="date" type="date" value="${e?e.date:todayStr()}">
    <button class="btn" id="save">${e?'Save changes':'Add'}</button>${e?'<button class="btn ghost" id="del">Delete</button>':''}`);
    $('#x').onclick=closeSheet;
    document.querySelectorAll('#tseg button').forEach(b=>b.onclick=()=>{window.__keep={amt:$('#amt').value};type=b.dataset.v;draw();$('#amt').focus()});
    $('#cat').onchange=ev=>{$('#catOther').classList.toggle('hide',ev.target.value!=='__other');if(ev.target.value==='__other')$('#catOther').focus()};
    $('#save').onclick=async()=>{
      const amount=Math.abs(parseFloat(($('#amt').value||'').replace(/[$,]/g,'')));
      let category=$('#cat').value;if(category==='__other')category=$('#catOther').value.trim();
      const date=$('#date').value||todayStr(),note=$('#note').value.trim();
      if(!amount){toast('Enter an amount');return}if(!category){toast('Pick a category');return}
      const b=$('#save');b.disabled=true;b.textContent='Saving…';
      try{
        if(e)await mutate(l=>l.map(x=>x.id===e.id?{...x,date,type,amount,category,note}:x));
        else await mutate(l=>l.concat([{id:'e'+Date.now().toString(36),date,type,amount,category,note}]));
        window.__keep=null;closeSheet();toast(e?'Saved':`Added ${money(amount)} · ${category}`);setStatus('Synced');render();
      }catch(err){toast('Failed: '+err.message);b.disabled=false;b.textContent=e?'Save changes':'Add'}
    };
    if($('#del'))$('#del').onclick=async()=>{if(!confirm('Delete this entry?'))return;try{await mutate(l=>l.filter(x=>x.id!==e.id));closeSheet();toast('Deleted');render()}catch(err){toast('Failed: '+err.message)}};
  };
  window.__keep=null;draw();if(!e)$('#amt').focus();
}
function openPlanned(id,presetDate){
  const orig=id?state.planned.find(x=>x.id===id):null;
  const w=orig?{...orig,...(presetDate?{date:presetDate}:{})}:{id:'pl-n'+Date.now().toString(36),date:addDays(todayStr(),1),type:'expense',amount:0,category:'',note:''};
  const preview=()=>{
    const amt=Math.abs(parseFloat(String($('#pamt').value).replace(/[$,]/g,''))||0);
    const tmp=state.planned.filter(x=>x.id!==w.id).concat([{...w,amount:amt}]);const f=forecast(tmp);const th=f.th;
    const el=$('#prev');const bad=f.low.bal<th;
    el.className='prev'+(bad?' bad':'');
    el.textContent=f.dips.length?`With this change you still dip below ${money(th)} (${f.dips.length} time${f.dips.length>1?'s':''}). Lowest ${money(Math.round(f.low.bal))} on ${fmtDate(f.low.date)}.`:`With this change you stay above ${money(th)}. Lowest ${money(Math.round(f.low.bal))} on ${fmtDate(f.low.date)}.`;
  };
  const draw=()=>{
    openSheet(`<div class="shd"><b>${orig?'Planned payment':'Add planned payment'}</b><button id="x">✕</button></div>
    <div class="seg" id="tseg"><button data-v="expense" class="${w.type==='expense'?'on':''}">Expense</button><button data-v="income" class="${w.type==='income'?'on':''}">Income</button></div>
    <input class="amt" id="pamt" inputmode="decimal" placeholder="$0.00" value="${w.amount||''}">
    <label>Category</label><select id="pcat">${catOptions(w.type,w.category)}</select>
    <input id="pcatOther" class="hide" placeholder="Category name" style="margin-top:8px">
    <label>Date</label><input id="pdate" type="date" value="${w.date}">
    <div class="nudge"><button data-n="-7">−1 week</button><button data-n="-1">−1 day</button><button data-n="1">+1 day</button><button data-n="7">+1 week</button></div>
    <div class="prev" id="prev"></div>
    <button class="btn" id="psave">Save</button>
    ${orig?`<button class="btn sec" id="ppost">Mark paid (move to Activity)</button><button class="btn ghost" id="pdel">Skip this one</button>`:''}`);
    $('#x').onclick=closeSheet;preview();
    document.querySelectorAll('#tseg button').forEach(b=>b.onclick=()=>{w.amount=parseFloat($('#pamt').value)||0;w.type=b.dataset.v;w.category='';draw()});
    $('#pcat').onchange=ev=>{$('#pcatOther').classList.toggle('hide',ev.target.value!=='__other');if(ev.target.value==='__other')$('#pcatOther').focus();if(ev.target.value!=='__other')w.category=ev.target.value};
    $('#pamt').oninput=preview;
    $('#pdate').onchange=ev=>{if(ev.target.value){w.date=ev.target.value;preview()}};
    document.querySelectorAll('.nudge button').forEach(b=>b.onclick=()=>{w.date=addDays($('#pdate').value||w.date,+b.dataset.n);$('#pdate').value=w.date;preview()});
    const readW=()=>{
      w.amount=Math.abs(parseFloat(String($('#pamt').value).replace(/[$,]/g,'')))||0;
      let c=$('#pcat').value;if(c==='__other')c=$('#pcatOther').value.trim();w.category=c;w.date=$('#pdate').value||w.date;
      if(!w.amount){toast('Enter an amount');return false}if(!w.category){toast('Pick a category');return false}return true;
    };
    $('#psave').onclick=()=>{
      if(!readW())return;
      state.planned=orig?state.planned.map(x=>x.id===w.id?{...w}:x):state.planned.concat([{...w}]);
      savePlannedSoon();closeSheet();render();toast('Plan updated');
    };
    if(orig){
      $('#pdel').onclick=()=>{if(!confirm('Remove this planned payment?'))return;state.planned=state.planned.filter(x=>x.id!==w.id);savePlannedSoon();closeSheet();render();toast('Removed from plan')};
      $('#ppost').onclick=async()=>{
        if(!readW())return;const b=$('#ppost');b.disabled=true;b.textContent='Posting…';
        try{
          const date=w.date>todayStr()?todayStr():w.date;
          await mutate(l=>l.concat([{id:'e'+Date.now().toString(36),date,type:w.type,amount:w.amount,category:w.category,note:w.note||''}]));
          state.planned=state.planned.filter(x=>x.id!==w.id);savePlannedSoon();closeSheet();render();toast('Moved to Activity');
        }catch(err){toast('Failed: '+err.message);b.disabled=false;b.textContent='Mark paid (move to Activity)'}
      };
    }
  };
  draw();
}

// ============ events ============
function bind(){
  const on=(s,f)=>{const el=$(s);if(el)el.onclick=f};
  bindChart();
  document.querySelectorAll('#rangeSeg button').forEach(b=>b.onclick=()=>{state.range=+b.dataset.r;render()});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{state.focus=b.dataset.focus||null;go('future')});
  document.querySelectorAll('[data-try]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const [pid,to]=b.dataset.try.split('|');openPlanned(pid,to)});
  document.querySelectorAll('.ev').forEach(r=>r.onclick=()=>openPlanned(r.dataset.pid));
  document.querySelectorAll('.tx').forEach(t=>t.onclick=()=>openEntry(t.dataset.id));
  on('#addPlanned',()=>openPlanned(null));
  on('#pm',()=>{state.month=shiftMonth(state.month,-1);render()});on('#nm',()=>{state.month=shiftMonth(state.month,1);render()});
  const s=$('#search');if(s)s.oninput=()=>{state.search=s.value;const p=s.selectionStart;render();const n=$('#search');n.focus();n.setSelectionRange(p,p)};
  on('#actualSet',async()=>{
    const v=parseFloat(String($('#actualIn').value).replace(/[$,]/g,''));if(isNaN(v)){toast('Enter your bank balance');return}
    state.budget.settings=Object.assign({},state.budget.settings,{actualBalance:v,actualDate:todayStr()});
    try{await saveBudget();toast('Saved');render()}catch(e){toast('Failed: '+e.message)}
  });
  on('#reconcile',async()=>{
    const s=settings(),diff=Math.round((s.actualBalance-balanceNow())*100)/100;if(!diff)return;
    if(!confirm(`Add a ${money(Math.abs(diff))} adjustment so Horizon matches your bank?`))return;
    try{await mutate(l=>l.concat([{id:'e'+Date.now().toString(36),date:todayStr(),type:diff>0?'income':'expense',amount:Math.abs(diff),category:'Reconcile',note:'Balance adjustment'}]));toast('Adjusted');render()}
    catch(e){toast('Failed: '+e.message)}
  });
  on('#saveCfg',()=>{cfg.repo=$('#repo').value.trim().replace(/^https?:\/\/github.com\//,'');cfg.token=$('#token').value.trim();LS.set('repo',cfg.repo);LS.set('token',cfg.token);state.tab='home';loadAll()});
  on('#forget',()=>{if(!confirm('Remove token and saved data from this device?'))return;try{localStorage.clear()}catch(e){}location.reload()});
  on('#saveSet',async()=>{
    const t=parseFloat($('#thr').value),o=parseFloat($('#opening').value);
    state.budget.settings=Object.assign({},state.budget.settings,{threshold:isNaN(t)?1000:t,openingBalance:isNaN(o)?0:o});
    try{await saveBudget();toast('Saved');render()}catch(e){toast('Failed: '+e.message)}
  });
  on('#addCat',()=>{readRows();state.budget.categories.push({name:'',budget:0});render()});
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{readRows();state.budget.categories.splice(+b.dataset.x,1);render()});
  on('#saveBud',async()=>{readRows();state.budget.categories=state.budget.categories.filter(c=>c.name.trim());
    try{await saveBudget();toast('Budgets saved');render()}catch(e){toast('Failed: '+e.message)}});
}
function readRows(){
  document.querySelectorAll('#brows .brow').forEach((r,i)=>{const c=state.budget.categories[i];if(!c)return;
    c.name=r.querySelector('[data-n]').value.trim();c.budget=parseFloat(r.querySelector('[data-b]').value)||0});
}

render();loadAll();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&configured()&&!$('#wrap').classList.contains('open'))loadAll()});
</script>
</body>
